<!DOCTYPE html>
<html>
<head>
<title>DHTML Fireplace</title>
<style>
html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:#050000;
}
canvas{
    display:block;
}
</style>
</head>

<body>

<canvas id="fire"></canvas>

<script>
const canvas=document.getElementById("fire");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
resize();
window.onresize=resize;

let flames=[];
let sparks=[];

function rand(a,b){
    return Math.random()*(b-a)+a;
}

class Flame{
    constructor(){
        this.reset();
    }

    reset(){
        this.x=canvas.width/2+rand(-120,120);
        this.y=canvas.height-100;
        this.radius=rand(15,45);
        this.speed=rand(1,4);
        this.life=rand(40,100);
        this.wobble=rand(-1,1);
    }

    update(){
        this.y-=this.speed;
        this.x+=Math.sin(this.life/10)*this.wobble;
        this.life--;

        if(this.life<=0)
            this.reset();
    }

    draw(){

        let alpha=this.life/100;

        let gradient=ctx.createRadialGradient(
            this.x,this.y,0,
            this.x,this.y,this.radius
        );

        gradient.addColorStop(0,
            "rgba(255,255,180,"+alpha+")");

        gradient.addColorStop(.25,
            "rgba(255,220,30,"+alpha+")");

        gradient.addColorStop(.7,
            "rgba(255,70,0,"+alpha+")");

        gradient.addColorStop(1,
            "rgba(120,0,0,0)");

        ctx.fillStyle=gradient;

        ctx.beginPath();

        ctx.ellipse(
            this.x,
            this.y,
            this.radius*.45,
            this.radius,
            0,0,Math.PI*2
        );

        ctx.fill();
    }
}


class Spark{
    constructor(){
        this.reset();
    }

    reset(){
        this.x=canvas.width/2+rand(-100,100);
        this.y=canvas.height-120;
        this.vx=rand(-1,1);
        this.vy=rand(-5,-2);
        this.life=rand(20,80);
    }

    update(){
        this.x+=this.vx;
        this.y+=this.vy;
        this.life--;

        if(this.life<=0)
            this.reset();
    }

    draw(){
        ctx.fillStyle="orange";
        ctx.beginPath();
        ctx.arc(this.x,this.y,2,0,Math.PI*2);
        ctx.fill();
    }
}


for(let i=0;i<180;i++)
    flames.push(new Flame());

for(let i=0;i<70;i++)
    sparks.push(new Spark());


function logs(){

let y=canvas.height-80;

ctx.fillStyle="#3b1808";

ctx.save();
ctx.translate(canvas.width/2,y);
ctx.rotate(.25);
ctx.fillRect(-150,-15,300,30);
ctx.restore();

ctx.save();
ctx.translate(canvas.width/2,y);
ctx.rotate(-.25);
ctx.fillRect(-150,-15,300,30);
ctx.restore();

}


function loop(){

requestAnimationFrame(loop);

ctx.fillStyle="rgba(0,0,0,.15)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.shadowBlur=40;
ctx.shadowColor="orange";

flames.forEach(f=>{
    f.update();
    f.draw();
});

ctx.shadowBlur=0;

sparks.forEach(s=>{
    s.update();
    s.draw();
});

logs();

}

loop();

</script>

</body>
</html>
