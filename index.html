<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Realistic Fireplace</title>
<style>
html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:#050201;
}
canvas{
    display:block;
}
</style>
</head>

<body>

<canvas id="fire"></canvas>

<script>

const canvas=document.getElementById("fire");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
resize();
onresize=resize;


let flames=[];
let embers=[];


function random(a,b){
    return a+Math.random()*(b-a);
}


class Flame{

constructor(layer){
    this.layer=layer;
    this.reset();
}


reset(){

this.baseX=
canvas.width/2+random(-140,140);

this.y=canvas.height-120;

this.height=
(layerHeight[this.layer]||150) *
random(.6,1.2);

this.width=random(25,80);

this.life=random(0,100);

this.speed=random(.5,1.5);

this.seed=random(0,100);

}


update(){

this.y-=this.speed;

this.life+=.08;

if(this.y<canvas.height-this.height-60)
    this.reset();

}


draw(){

let sway=Math.sin(
this.life*3+this.seed
)*20;


let x=this.baseX+sway;


ctx.save();

ctx.translate(x,this.y);


let grad;


if(this.layer==0){

// hottest center

grad=ctx.createLinearGradient(
0,this.height,0,0);

grad.addColorStop(0,
"rgba(255,255,230,.95)");

grad.addColorStop(.3,
"rgba(255,220,40,.9)");

grad.addColorStop(1,
"rgba(255,120,0,0)");

}

else if(this.layer==1){

grad=ctx.createLinearGradient(
0,this.height,0,0);

grad.addColorStop(0,
"rgba(255,160,20,.9)");

grad.addColorStop(.5,
"rgba(255,70,0,.8)");

grad.addColorStop(1,
"rgba(120,0,0,0)");

}

else{

grad=ctx.createLinearGradient(
0,this.height,0,0);

grad.addColorStop(0,
"rgba(255,80,0,.6)");

grad.addColorStop(1,
"rgba(60,0,0,0)");

}


ctx.fillStyle=grad;


ctx.beginPath();

ctx.moveTo(0,0);

ctx.bezierCurveTo(
-this.width,
this.height*.35,
-this.width*.8,
this.height*.8,
0,
this.height
);

ctx.bezierCurveTo(
this.width*.8,
this.height*.75,
this.width,
this.height*.25,
0,
0
);

ctx.fill();

ctx.restore();

}

}



for(let l=0;l<3;l++){

for(let i=0;i<45;i++)
flames.push(new Flame(l));

}



class Ember{

constructor(){
this.reset();
}

reset(){

this.x=canvas.width/2+random(-150,150);
this.y=canvas.height-130;

this.vx=random(-.5,.5);
this.vy=random(-4,-1);

this.life=random(20,100);

}

update(){

this.x+=this.vx;
this.y+=this.vy;

this.vy+=.01;

this.life--;

if(this.life<0)
this.reset();

}


draw(){

ctx.fillStyle=
"rgba(255,180,40,"+
(this.life/100)+")";

ctx.beginPath();

ctx.arc(
this.x,
this.y,
random(1,3),
0,
Math.PI*2);

ctx.fill();

}

}


for(let i=0;i<120;i++)
embers.push(new Ember());



function logs(){

let y=canvas.height-80;

ctx.shadowBlur=25;
ctx.shadowColor="#ff5500";

ctx.fillStyle="#321407";


ctx.save();
ctx.translate(canvas.width/2,y);
ctx.rotate(.25);
ctx.fillRect(-170,-20,340,40);
ctx.restore();


ctx.save();
ctx.translate(canvas.width/2,y);
ctx.rotate(-.25);
ctx.fillRect(-170,-20,340,40);
ctx.restore();


ctx.shadowBlur=0;

}


function animate(){

requestAnimationFrame(animate);


ctx.fillStyle="rgba(0,0,0,.18)";
ctx.fillRect(0,0,canvas.width,canvas.height);


ctx.shadowBlur=45;
ctx.shadowColor="orange";


flames.forEach(f=>{
f.update();
f.draw();
});


ctx.shadowBlur=0;


embers.forEach(e=>{
e.update();
e.draw();
});


logs();


}


animate();

</script>

</body>
</html>
