<html lang="en">
<head>

<title>DHTML Fireplace DVD</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#000;
    height:100%;
    font-family:Arial;
}

canvas{
    display:block;
}

#overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:

    radial-gradient(circle at center 70%, rgba(255,180,80,.08), transparent 60%);
    mix-blend-mode:screen;
}

#title{
    position:absolute;
    top:18px;
    width:100%;
    text-align:center;
    color:#ffffff66;
    letter-spacing:8px;
    font-size:22px;
    text-transform:uppercase;
    text-shadow:0 0 15px orange;
}

#controls{
    position:absolute;
    bottom:18px;
    width:100%;
    text-align:center;
    color:#ccc;
    font-size:14px;
}

<body>

<canvas id="c"></canvas>

<div id="overlay"></div>

<div id="title">
Virtual Fireplace
</div>

<div id="controls">
Space = More Flames • F = Fullscreen
</div>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

let flames=[];
let sparks=[];

let intensity=1;

class Flame{

constructor(){

this.reset();

}

reset(){

this.x=canvas.width/2+(Math.random()-0.5)*140;
this.y=canvas.height-120;

this.vx=(Math.random()-0.5)*0.6;

this.vy=-(2+Math.random()*3);

this.size=25+Math.random()*40;

this.life=1;

this.decay=.008+Math.random()*.012;

this.color=Math.random();

}

update(){

this.x+=this.vx;
this.y+=this.vy;

this.vx+=(Math.random()-.5)*.08;

this.life-=this.decay;

if(this.life<=0) this.reset();

}

draw(){

ctx.save();

ctx.globalAlpha=this.life;

let g=ctx.createRadialGradient(
this.x,this.y,0,
this.x,this.y,this.size
);

g.addColorStop(0,"rgba(255,255,180,.9)");

if(this.color>.5)
g.addColorStop(.4,"rgba(255,180,20,.8)");
else
g.addColorStop(.4,"rgba(255,80,0,.8)");

g.addColorStop(1,"rgba(0,0,0,0)");

ctx.fillStyle=g;

ctx.beginPath();
ctx.ellipse(
this.x,
this.y,
this.size*.35,
this.size,
0,0,Math.PI*2);
ctx.fill();

ctx.restore();

}

}

class Spark{

constructor(){

this.reset();

}

reset(){

this.x=canvas.width/2+(Math.random()-.5)*180;
this.y=canvas.height-120;
this.vx=(Math.random()-.5)*2;
this.vy=-(3+Math.random()*4);
this.life=1;
this.size=1+Math.random()*3;

}

update(){

this.x+=this.vx;
this.y+=this.vy;

this.life-=0.012;

if(this.life<0)
this.reset();

}

draw(){

ctx.fillStyle=`rgba(255,${180+Math.random()*70},60,${this.life})`;

ctx.beginPath();
ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
ctx.fill();

}

}

function build(){

flames=[];
sparks=[];

for(let i=0;i<140*intensity;i++)
flames.push(new Flame());

for(let i=0;i<80;i++)
sparks.push(new Spark());

}

build();

}
